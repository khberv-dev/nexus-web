services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/platform
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

  # Веб: снаружи слушает 0.0.0.0:HOST_APP_PORT → контейнер :3000 (Next standalone).
  # Внешний доступ по DNS: A/AAAA на этот сервер, фаервол открыть HOST_APP_PORT
  # (или 80/443 если перед приложением стоит reverse proxy и проксирует на HOST_APP_PORT).
  # В .env обязательно задайте под свой домен:
  #   NEXTAUTH_URL=https://ваш-домен.example   (публичный URL без лишнего слеша в конце)
  #   ALLOWED_ORIGINS=ваш-домен.example,www.ваш-домен.example
  # (+ в Zitadel redirect URIs: …/api/auth/callback/zitadel и …/api/auth/callback/email)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
    mem_limit: 2g
    mem_reservation: 1g
    ports:
      - "${HOST_APP_BIND:-0.0.0.0}:${HOST_APP_PORT:-3000}:3000"
      - "${HOST_CHAT_WS_BIND:-127.0.0.1}:${HOST_CHAT_WS_PORT:-3001}:3001"
    environment:
      - NODE_OPTIONS=--max-old-space-size=1024 --heapsnapshot-near-heap-limit=2
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/platform
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://nexuspro.ru}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-nexuspro.ru}
      # Billing can be disabled during rollout (do not block stages on payments)
      - SKIP_STAGE_PAYMENTS=${SKIP_STAGE_PAYMENTS:-false}
      - NEXT_PUBLIC_SKIP_STAGE_PAYMENTS=${NEXT_PUBLIC_SKIP_STAGE_PAYMENTS:-false}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID}
      - ZITADEL_PROJECT_ID=${ZITADEL_PROJECT_ID}
      - ZITADEL_ORG_ID=${ZITADEL_ORG_ID}
      - ZITADEL_SERVICE_ACCOUNT_KEY=${ZITADEL_SERVICE_ACCOUNT_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3.cloud.ru}
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-https://s3.cloud.ru}
      - S3_REGION=${S3_REGION:-ru-central-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-nexus}
      # "local" — файлы на диске контейнера (том uploads_data ниже) вместо S3.
      - STORAGE_DRIVER=${STORAGE_DRIVER:-}
      - STORAGE_URL_SECRET=${STORAGE_URL_SECRET:-}
      # Каталог загрузок при local-драйвере; по умолчанию /app/uploads (том uploads_data).
      - STORAGE_LOCAL_ROOT=${STORAGE_LOCAL_ROOT:-}
      - BILLING_SVC_URL=http://billing-svc:8090
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - TBANK_WEBHOOK_SECRET=${TBANK_WEBHOOK_SECRET}
      - REDIS_URL=redis://redis:6379
      - CHAT_WS_SECRET=${CHAT_WS_SECRET:-}
      - DEMO_ACCESS_KEY=${DEMO_ACCESS_KEY}
    volumes:
      # Загрузки при STORAGE_DRIVER=local. Без тома файлы живут только внутри контейнера
      # и пропадают при каждом пересоздании (деплой, рестарт, OOM), а строки UserFile
      # в базе остаются — ссылки начинают отдавать 404.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # billing-svc:
      #   condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        i=0;
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do
          i=$$((i+1));
          if [ $$i -ge 60 ]; then echo 'MinIO not ready'; exit 1; fi;
          sleep 2;
        done;
        mc mb --ignore-existing local/$${S3_BUCKET:-platform};
        mc anonymous set download local/$${S3_BUCKET:-platform} || true;
        exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-platform}

  # billing-svc:
  #   build:
  #     context: ./services/tbank
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8090:8090"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/platform
  #     REDIS_URL: redis://redis:6379
  #     TBANK_ACCOUNT_NUMBER: ${TBANK_ACCOUNT_NUMBER:-}
  #     TBANK_API_TOKEN: ${TBANK_API_TOKEN}
  #     TBANK_ENCRYPTION_KEY: ${TBANK_ENCRYPTION_KEY}
  #     TBANK_ENVIRONMENT: ${TBANK_ENVIRONMENT:-sandbox}
  #     TBANK_SECRET_KEY: ${TBANK_SECRET_KEY}
  #     TBANK_SERVER_PORT: "8090"
  #     TBANK_TERMINAL_KEY: ${TBANK_TERMINAL_KEY}
  #     TBANK_USE_ZITADEL: "false"
  #     TBANK_WEBHOOK_SECRET: ${TBANK_WEBHOOK_SECRET}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  uploads_data:
