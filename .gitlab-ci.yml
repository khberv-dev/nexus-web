stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

lint:
  stage: lint
  image: node:22-alpine
  script:
    - npm ci
    - npm run lint

test:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npx prisma generate
    - npm test

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE

deploy:staging:
  stage: deploy
  environment: staging
  only:
    - develop
  script:
    - echo "Deploy to staging"
    # Add your deployment commands here

deploy:production:
  stage: deploy
  environment: production
  when: manual
  only:
    - main
  script:
    - echo "Deploy to production"
    # Add your deployment commands here
