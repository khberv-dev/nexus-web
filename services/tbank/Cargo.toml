[workspace]
resolver = "2"
members = [
    "tbank-integration",
    "shared",
]

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "compression-gzip", "compression-deflate", "timeout"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "any", "uuid", "chrono", "migrate", "macros", "rust_decimal"], default-features = false }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde", "macros"] }
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }

# Metrics
prometheus = "0.14"
metrics = "0.24"
metrics-prometheus = "0.7"

# Circuit breaker and resilience
failsafe = "1.3"

# Performance
dashmap = "6.1"
parking_lot = "0.12"

# Random number generation
fastrand = "2.2"

# JWT and authentication
jsonwebtoken = "9.3"
base64 = "0.22"
ring = "0.17"

# Testing
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
futures = "0.3"

# API Documentation Export
ts-rs = { version = "10.0", features = ["chrono-impl", "uuid-impl"] }
utoipa = { version = "5.2", features = ["axum_extras", "chrono", "uuid", "decimal"] }
walkdir = "2.5"
regex = "1.11"
handlebars = "6.2"
path-clean = "1.0"
tempfile = "3.14"
