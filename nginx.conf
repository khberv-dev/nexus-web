upstream next_app {
    # Если это конфиг для nginx НА ХОСТЕ:
    # - Next.js из docker-compose опубликован на localhost:3000
    server 127.0.0.1:3000;

    # Если вы все-таки запускаете nginx В docker-compose:
    # - замените строку выше на: server app:3000;
}

upstream chat_ws {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name nexuspro.ru;

    # Полезно для загрузок/streaming
    client_max_body_size 50m;

    location = /ws/chat {
        proxy_pass http://chat_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
    }

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket / SSE
        proxy_set_header Upgrade $http_upgrade;
        # Без "map" переменной $connection_upgrade не существует, поэтому ставим явно.
        # Если нужен более аккуратный вариант (upgrade только при наличии Upgrade),
        # можно добавить map в http{} и вернуть $connection_upgrade.
        proxy_set_header Connection "upgrade";
    }
}
